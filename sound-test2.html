<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音の録画テスト2</title>
<style>
:root{--bg:#75fba4;--ink:#1f3a5c;--paper:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Maru Gothic ProN",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:10px}
h1{font-size:1.2rem;margin:4px 0}
p{margin:0;font-size:.9rem}
button{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer}
button:active{background:#ffe45c}
.no{display:inline-block;min-width:1.6em;font-weight:700}
#log{background:var(--paper);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;min-height:4em}
video{display:none}
</style>
</head>
<body>
<main>
  <h1>音の録画テスト2</h1>
  <p>前回と同じく、画面収録を始めてからA〜Fを順に押してください（1つずつ、声が鳴り終わってから次へ）。録画で普通に入っていた記号を教えてください。</p>
  <button id="A"><span class="no">A</span>動画と同じ部品・ステレオAAC 48kHz（YouTubeに近い形）</button>
  <button id="B"><span class="no">B</span>音声の部品・ステレオAAC 48kHz</button>
  <button id="C"><span class="no">C</span>音声の部品・ステレオAAC 44.1kHz</button>
  <button id="D"><span class="no">D</span>音声の部品・ステレオMP3 48kHz</button>
  <button id="E"><span class="no">E</span>音声の部品・今のファイル（モノラルMP3 44.1kHz）</button>
  <button id="F"><span class="no">F</span>ゲームと同じ仕組み・ステレオAAC 48kHz</button>
  <video id="vid" playsinline preload="auto" src="test/v_stereo48.m4a"></video>
  <div id="log"></div>
</main>
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
function el(src){const a=new Audio(src);a.preload='auto';a.setAttribute('playsinline','');return a}
const src={B:'test/v_stereo48.m4a',C:'test/v_stereo44.m4a',D:'test/v_stereo48.mp3',E:'voice/p1_03.mp3'};
const els={}; for(const k in src) els[k]=el(src[k]);
function play(m,k){m.currentTime=0;m.play().then(()=>log(k+'：再生')).catch(e=>log(k+'：再生できません '+e.message))}
document.getElementById('A').onclick=()=>play(document.getElementById('vid'),'A');
for(const k of ['B','C','D','E']) document.getElementById(k).onclick=()=>play(els[k],k);
let ctx=null,buf=null;
document.getElementById('F').onclick=async()=>{
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();log('F：仕組みの周波数 '+ctx.sampleRate+'Hz')}
    if(ctx.state==='suspended')await ctx.resume();
    if(!buf)buf=await ctx.decodeAudioData(await fetch(src.B).then(r=>r.arrayBuffer()));
    const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start();log('F：再生');
  }catch(e){log('F：再生できません '+e.message)}
};
log(navigator.userAgent);
</script>
</body>
</html>
