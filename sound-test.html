<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音の録画テスト</title>
<style>
:root{--bg:#75fba4;--ink:#1f3a5c;--paper:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Maru Gothic ProN",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:10px}
h1{font-size:1.2rem;margin:4px 0}
p{margin:0;font-size:.9rem}
button{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer}
button:active{background:#ffe45c}
.no{display:inline-block;min-width:1.6em;font-weight:700}
#log{background:var(--paper);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;min-height:4em}
</style>
</head>
<body>
<main>
  <h1>音の録画テスト</h1>
  <p>画面収録を始めてから、①〜⑥を順に押してください。録画を見返して、どの番号が「普通の声・普通の高さの音」で入っていたかを教えてください。</p>
  <button id="b1"><span class="no">①</span>声：普通の音声ファイル再生（動画と同じ扱い）</button>
  <button id="b2"><span class="no">②</span>声：今のゲームと同じ仕組み</button>
  <button id="b3"><span class="no">③</span>声：今の仕組み＋48kHzに合わせる</button>
  <button id="b4"><span class="no">④</span>ピー音：今のゲームと同じ仕組み</button>
  <button id="b5"><span class="no">⑤</span>ピー音：今の仕組み＋48kHzに合わせる</button>
  <button id="b6"><span class="no">⑥</span>音の仕組みを作り直す（押したあと②〜⑤をもう一度）</button>
  <div id="log"></div>
</main>
<script>
const VOICE='voice/p1_03.mp3';               // 「長濱ねる」
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
let ctxA=null, ctxB=null, bufA=null, bufB=null;
const AC=window.AudioContext||window.webkitAudioContext;

async function makeCtx(rate){
  const c=rate?new AC({sampleRate:rate}):new AC();
  if(c.state==='suspended')await c.resume();
  const ab=await fetch(VOICE).then(r=>r.arrayBuffer());
  const buf=await c.decodeAudioData(ab);
  return [c,buf];
}
async function ensure(){
  if(!ctxA){[ctxA,bufA]=await makeCtx(0);log('②④の仕組み：'+ctxA.sampleRate+'Hz')}
  if(!ctxB){try{[ctxB,bufB]=await makeCtx(48000);log('③⑤の仕組み：'+ctxB.sampleRate+'Hz')}catch(e){log('48kHz指定は使えませんでした：'+e.message)}}
}
function playBuf(c,b){if(!c||!b)return;const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start()}
function beep(c){if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.25;o.connect(g).connect(c.destination);const t=c.currentTime;o.start(t);o.stop(t+1)}

const el=new Audio(VOICE); el.preload='auto'; el.setAttribute('playsinline','');
document.getElementById('b1').onclick=()=>{el.currentTime=0;el.play().catch(e=>log('①再生できません：'+e.message))};
document.getElementById('b2').onclick=async()=>{await ensure();playBuf(ctxA,bufA)};
document.getElementById('b3').onclick=async()=>{await ensure();playBuf(ctxB,bufB)};
document.getElementById('b4').onclick=async()=>{await ensure();beep(ctxA)};
document.getElementById('b5').onclick=async()=>{await ensure();beep(ctxB)};
document.getElementById('b6').onclick=async()=>{
  try{ctxA&&await ctxA.close()}catch(e){} try{ctxB&&await ctxB.close()}catch(e){}
  ctxA=ctxB=null; await ensure(); log('作り直しました');
};
log(navigator.userAgent);
</script>
</body>
</html>
